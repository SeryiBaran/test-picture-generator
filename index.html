<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display test picture generator</title>
    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/bresenham.js"></script>
    <link rel="stylesheet" href="./css/gardevoir.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1>Display test picture generator</h1>

      <p class="description">
        This tool generates simple picture for testing display with JavaScript Canvas.
      </p>

      <form action="#">
        <div class="config">
          <button class="button" id="quick_test">Quick test</button>

          <select id="standard_resolutions">
            <option value="" disabled selected>Select resolution</option>
          </select>
          <div id="sizeConfig">
            <input class="width_input" type="number" id="width" value="400" />
            <span>X</span>
            <input class="height_input" type="number" id="height" value="300" />
          </div>
          <button class="button" id="generate">Generate</button>
          <button class="button" id="generate_current_resolution">Make for my display</button>
          <a class="button" id="download" href="#">Download picture (PNG)</a>
          <button class="button" id="go_fullscreen">Open fullscreen</button>
          <label class="checkbox_label advanced_check_label">
            <input
              class="checkbox_input"
              type="checkbox"
              name="advanced_check"
              id="advanced_check"
            />
            <span
              class="advanced_check_button button button_icon"
              onclick="e => e.preventDefault()"
              type="button"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1.2em"
                height="1.2em"
                viewBox="4 4 16 16"
              >
                <path
                  fill="none"
                  stroke="#d4d4d4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m9 6l6 6l-6 6"
                />
              </svg>
              Advanced settings
            </span>
          </label>
        </div>
        <div id="advanced" style="display: none">
          <div class="advanced_checkboxes">
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="show_site_name_check"
                id="show_site_name_check"
                checked
              />
              <span class="checkbox_box"></span>
              Show site name at big resolutions
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="disable_grid_check"
                id="disable_grid_check"
              />
              <span class="checkbox_box"></span>
              Disable grid
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="limited_grid_check"
                id="limited_grid_check"
              />
              <span class="checkbox_box"></span>
              Limited grid
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="disable_maxwidth_check"
                id="disable_maxwidth_check"
              />
              <span class="checkbox_box"></span>
              Disable max-width
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="only_geometry_mode_check"
                id="only_geometry_mode_check"
              />
              <span class="checkbox_box"></span>
              Only geometry
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="disable_colors_check"
                id="disable_colors_check"
              />
              <span class="checkbox_box"></span>
              Disable colors
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="use_bresenham_algorithms_check"
                id="use_bresenham_algorithms_check"
              />
              <span class="checkbox_box"></span>
              Use Bresenham algorithms
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="disable_antialiasing_check"
                id="disable_antialiasing_check"
              />
              <span class="checkbox_box"></span>
              Disable displaying antialiasing
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="enable_antialiasing_disable_filter_check"
                id="enable_antialiasing_disable_filter_check"
              />
              <span class="checkbox_box"></span>
              Enable antialiasing disabling filter (VERY LAGGY!)
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="slider_advanced_check"
                id="slider_advanced_check"
              />
              <span class="checkbox_box"></span>
              Advanced sliders
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="slider_advanced_autogen_check"
                id="slider_advanced_autogen_check"
              />
              <span class="checkbox_box"></span>
              Autogen by sliders move
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="inputs_autogen_check"
                id="inputs_autogen_check"
              />
              <span class="checkbox_box"></span>
              Autogen by inputs (CAN FUCK PC!)
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="select_autogen_check"
                id="select_autogen_check"
              />
              <span class="checkbox_box"></span>
              Autogen by standard resolutions select
            </label>
            <label class="checkbox_label">
              <input
                class="checkbox_input"
                type="checkbox"
                name="checkboxes_autogen_check"
                id="checkboxes_autogen_check"
                checked
              />
              <span class="checkbox_box"></span>
              Autogen by checkboxes
            </label>
          </div>
          <div class="sliders">
            <label>
              Width:
              <input
                type="range"
                id="slider_width"
                min="100"
                max="1920"
                value="400"
              />
            </label>
            <label>
              Height:
              <input
                type="range"
                id="slider_height"
                min="100"
                max="1080"
                value="300"
              />
            </label>
          </div>
        </div>
      </form>

      <div id="workspace"></div>

      <footer>
        <p class="credits">
          Written by <a href="https://github.com/fknipp/test-picture-generator/">fknipp</a> and
          <a href="https://github.com/SeryiBaran/test-picture-generator/">SeryiBaran</a>.
        </p>
      </footer>
    </div>

    <script src="./js/cli_utils.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
